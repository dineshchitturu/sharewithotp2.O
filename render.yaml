services:
  - type: web
    name: sharewithotp-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: ROOM_EXPIRY_SECONDS
        value: "900"
      - key: MAX_OTP_ATTEMPTS
        value: "5"
      - key: PYTHON_VERSION
        value: 3.11.6
